<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101923">
  <title>Junior Pocket Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="loadingScreen" class="screen active loading-screen">
      <div class="logo">
        <strong>JUNIOR</strong>
        <span>POCKET ADVENTURE</span>
      </div>

      <div class="loader-junior" aria-hidden="true">
        <div class="loader-ear left"></div>
        <div class="loader-ear right"></div>
        <div class="loader-body"></div>
      </div>

      <div class="loading-track">
        <div id="loadingBar" class="loading-fill"></div>
      </div>
      <p id="loadingText">Preparando a Junior...</p>
    </section>

    <section id="menuScreen" class="screen menu-screen">
      <div class="menu-card">
        <div class="logo menu-logo">
          <strong>JUNIOR</strong>
          <span>POCKET ADVENTURE</span>
        </div>

        <div class="menu-junior" aria-hidden="true">
          <div class="menu-ear left"></div>
          <div class="menu-ear right"></div>
          <div class="menu-body">
            <div class="menu-eye left-eye"><i></i></div>
            <div class="menu-eye right-eye"><i></i></div>
            <div class="menu-mouth"></div>
          </div>
        </div>

        <button id="playBtn" class="btn primary">Jugar</button>
        <button id="continueBtn" class="btn secondary">Continuar</button>
        <button id="settingsBtn" class="btn secondary">Ajustes</button>
        <small>Versión 0.4.0</small>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen living-room">
      <header class="topbar">
        <div class="currency"><span class="coin"></span><b id="coins">1250</b></div>
        <div class="currency"><span class="diamond"></span><b id="diamonds">30</b></div>
        <button id="backToMenu" class="menu-icon" aria-label="Volver al menú">☰</button>
      </header>

      <div class="room">
        <div class="window">
          <div class="sky"></div>
          <div class="hill one"></div>
          <div class="hill two"></div>
        </div>

        <div class="rug"></div>

        <div id="junior" class="junior junior-vector" data-state="neutral" tabindex="0" aria-label="Junior">
          <svg class="junior-svg" viewBox="0 0 600 650" role="img" aria-label="Junior">
            <defs>
              <linearGradient id="bodyGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#e8a557"/>
                <stop offset=".52" stop-color="#ca7735"/>
                <stop offset="1" stop-color="#95471f"/>
              </linearGradient>
              <linearGradient id="earGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#c77a38"/>
                <stop offset="1" stop-color="#88401d"/>
              </linearGradient>
              <radialGradient id="chestGradient" cx=".45" cy=".2" r=".9">
                <stop offset="0" stop-color="#fff1cd"/>
                <stop offset=".72" stop-color="#efd7aa"/>
                <stop offset="1" stop-color="#d5b47c"/>
              </radialGradient>
              <radialGradient id="noseGradient" cx=".35" cy=".22" r=".8">
                <stop offset="0" stop-color="#615951"/>
                <stop offset=".45" stop-color="#2d2723"/>
                <stop offset="1" stop-color="#110e0c"/>
              </radialGradient>
              <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
                <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#2f1b11" flood-opacity=".32"/>
              </filter>
              <filter id="innerSoft" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4"/>
              </filter>
              <clipPath id="leftEyeClip">
                <ellipse cx="244" cy="264" rx="68" ry="83"/>
              </clipPath>
              <clipPath id="rightEyeClip">
                <ellipse cx="356" cy="264" rx="68" ry="83"/>
              </clipPath>
            </defs>

            <ellipse class="vector-shadow" cx="300" cy="590" rx="218" ry="34"/>

            <g class="vector-rig" filter="url(#softShadow)">
              <g class="vector-ear vector-ear-left">
                <path d="M174 178 C112 150 61 177 48 232 C36 282 55 330 97 342 C138 354 166 318 183 281 C198 247 211 198 174 178 Z"
                      fill="url(#earGradient)" stroke="#462719" stroke-width="12" stroke-linejoin="round"/>
                <path d="M156 197 C113 178 79 193 70 232 C62 265 77 295 105 303"
                      fill="none" stroke="#e69a51" stroke-opacity=".38" stroke-width="9" stroke-linecap="round"/>
              </g>

              <g class="vector-ear vector-ear-right">
                <path d="M426 178 C488 150 539 177 552 232 C564 282 545 330 503 342 C462 354 434 318 417 281 C402 247 389 198 426 178 Z"
                      fill="url(#earGradient)" stroke="#462719" stroke-width="12" stroke-linejoin="round"/>
                <path d="M444 197 C487 178 521 193 530 232 C538 265 523 295 495 303"
                      fill="none" stroke="#e69a51" stroke-opacity=".38" stroke-width="9" stroke-linecap="round"/>
              </g>

              <path class="vector-body"
                    d="M300 104
                       C208 104 143 161 120 250
                       C98 332 77 420 82 495
                       C87 575 165 606 300 606
                       C435 606 513 575 518 495
                       C523 420 502 332 480 250
                       C457 161 392 104 300 104 Z"
                    fill="url(#bodyGradient)" stroke="#402418" stroke-width="13" stroke-linejoin="round"/>

              <path class="head-stripe"
                    d="M286 114 C294 106 306 106 314 114
                       C320 154 321 188 316 220
                       C310 235 290 235 284 220
                       C279 188 280 154 286 114 Z"
                    fill="#f5d9a5" opacity=".95"/>

              <path class="chest"
                    d="M300 343
                       C239 343 194 390 180 475
                       C168 551 215 590 300 590
                       C385 590 432 551 420 475
                       C406 390 361 343 300 343 Z"
                    fill="url(#chestGradient)"/>

              <g class="fur-stripes fur-stripes-left" opacity=".27" stroke="#73401f" stroke-width="12" stroke-linecap="round">
                <path d="M126 360 L173 382"/>
                <path d="M112 408 L165 430"/>
                <path d="M106 457 L158 477"/>
              </g>
              <g class="fur-stripes fur-stripes-right" opacity=".27" stroke="#73401f" stroke-width="12" stroke-linecap="round">
                <path d="M474 360 L427 382"/>
                <path d="M488 408 L435 430"/>
                <path d="M494 457 L442 477"/>
              </g>

              <g class="face">
                <g class="vector-eye vector-eye-left">
                  <ellipse cx="244" cy="264" rx="68" ry="83" fill="#fffefb" stroke="#201915" stroke-width="11"/>
                  <g clip-path="url(#leftEyeClip)">
                    <g class="vector-pupil vector-pupil-left">
                      <ellipse cx="244" cy="276" rx="24" ry="31" fill="#1b1714"/>
                      <ellipse cx="236" cy="264" rx="7" ry="9" fill="#ffffff" opacity=".72"/>
                    </g>
                    <path class="vector-eyelid vector-eyelid-left"
                          d="M168 179 H320 V278
                             C296 248 272 237 244 237
                             C216 237 192 248 168 278 Z"
                          fill="#d6843f" stroke="#4a2a1b" stroke-width="7"/>
                  </g>
                </g>

                <g class="vector-eye vector-eye-right">
                  <ellipse cx="356" cy="264" rx="68" ry="83" fill="#fffefb" stroke="#201915" stroke-width="11"/>
                  <g clip-path="url(#rightEyeClip)">
                    <g class="vector-pupil vector-pupil-right">
                      <ellipse cx="356" cy="276" rx="24" ry="31" fill="#1b1714"/>
                      <ellipse cx="348" cy="264" rx="7" ry="9" fill="#ffffff" opacity=".72"/>
                    </g>
                    <path class="vector-eyelid vector-eyelid-right"
                          d="M280 179 H432 V278
                             C408 248 384 237 356 237
                             C328 237 304 248 280 278 Z"
                          fill="#d6843f" stroke="#4a2a1b" stroke-width="7"/>
                  </g>
                </g>

                <path class="vector-brow vector-brow-left" d="M194 177 C218 163 244 160 266 171"
                      fill="none" stroke="#4a2a1b" stroke-width="10" stroke-linecap="round"/>
                <path class="vector-brow vector-brow-right" d="M334 171 C356 160 382 163 406 177"
                      fill="none" stroke="#4a2a1b" stroke-width="10" stroke-linecap="round"/>

                <g class="muzzle-group">
                  <ellipse cx="300" cy="367" rx="104" ry="84" fill="#f3dfba" stroke="#9d6f3e" stroke-width="5"/>
                  <ellipse class="vector-nose" cx="300" cy="335" rx="48" ry="38" fill="url(#noseGradient)" stroke="#211a16" stroke-width="7"/>
                  <ellipse cx="284" cy="323" rx="11" ry="7" fill="#ffffff" opacity=".13"/>
                  <path class="mouth-center" d="M300 370 L300 393" stroke="#3a2419" stroke-width="7" stroke-linecap="round"/>
                  <path class="vector-mouth vector-mouth-left" d="M300 393 C280 411 254 409 240 393"
                        fill="none" stroke="#3a2419" stroke-width="8" stroke-linecap="round"/>
                  <path class="vector-mouth vector-mouth-right" d="M300 393 C320 411 346 409 360 393"
                        fill="none" stroke="#3a2419" stroke-width="8" stroke-linecap="round"/>
                  <ellipse class="open-mouth" cx="300" cy="409" rx="27" ry="18" fill="#5c3024" opacity="0"/>
                </g>
              </g>
            </g>
          </svg>
        </div>

        <div id="message" class="message" hidden></div>
      </div>

      <section class="needs">
        <article>
          <span>Hambre</span>
          <div class="bar"><i id="hungerBar"></i></div>
          <b id="hungerText">85%</b>
        </article>
        <article>
          <span>Sueño</span>
          <div class="bar"><i id="sleepBar"></i></div>
          <b id="sleepText">70%</b>
        </article>
        <article>
          <span>Higiene</span>
          <div class="bar"><i id="hygieneBar"></i></div>
          <b id="hygieneText">80%</b>
        </article>
        <article>
          <span>Felicidad</span>
          <div class="bar"><i id="happinessBar"></i></div>
          <b id="happinessText">90%</b>
        </article>
      </section>

      <nav class="rooms-nav">
        <button data-room="living" class="active">Sala</button>
        <button data-room="kitchen">Cocina</button>
        <button data-room="bathroom">Baño</button>
        <button data-room="bedroom">Dormitorio</button>
      </nav>

      <div class="actions">
        <button data-action="feed">Dar comida</button>
        <button data-action="clean">Bañar</button>
        <button data-action="play">Jugar</button>
        <button data-action="sleep">Dormir</button>
      </div>
    </section>

    <section id="settingsScreen" class="screen settings-screen">
      <div class="settings-card">
        <h2>Ajustes</h2>
        <label><span>Música</span><input id="musicToggle" type="checkbox" checked></label>
        <label><span>Sonidos</span><input id="soundToggle" type="checkbox" checked></label>
        <label><span>Movimiento reducido</span><input id="motionToggle" type="checkbox"></label>
        <button id="settingsBack" class="btn primary">Regresar</button>
      </div>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/character.js"></script>
  <script src="js/game.js"></script>
  <script src="app.js"></script>
</body>
</html>
